# 内核构建配置（单一事实来源）
#
# 本文件由 build.rs 在编译期读取

# 内核加载基址
k_base_address = 0x40200000
# 内核高半区虚拟地址偏移（内核 VA = PA + k_v_mem_offset，须 1 GiB 对齐）
k_v_mem_offset = 0xFFFFFFC000000000
# mtime 寄存器递增频率（单位：Hz），用于计算时间
# 根据JH7110 TRM，mtime寄存器时钟来自 osc时钟/6 ，而 osc时钟为24MHz，
# 因此 mtime 寄存器频率为 4MHz
mtime_frequency = 4000000
# 内核栈大小（字节，必须与页大小对齐，默认 8KB）
k_stack_size = 0x2000
# 用户栈大小（字节，必须与页大小对齐，默认 8KB）
u_stack_size = 0x2000
# 内核时钟中断周期（单位：微秒，默认 10000）
stimer_interval = 10000
# 内核堆大小（2^k_heap_size_shift 字节，默认 1MB）
k_heap_size_shift = 20
# 标准页大小（2^page_size_shift 字节，默认 4KB）
page_size_shift = 12
# 内存基址
mem_base_address = 0x40000000

# 日志等级过滤：低于该等级的日志在编译期被折叠剔除，不产生运行时开销，
# 其字符串字面量也不会进入 kernel.bin。
# 可选：error | warn | info | debug | trace（越靠前越严重；缺省 debug）
log_level = "debug"
