# 内核构建配置（单一事实来源）
#
# 本文件由 build.rs 在编译期读取，并分发到：
#   - 链接脚本：通过 -defsym=BASE_ADDRESS=... 注入（链接器"宏"）
#   - Rust 源码：生成 OUT_DIR/generated.rs 中的常量，经 config.rs 引入
#
# 数值配置（十六进制或十进制均可）与字符串配置（如 log_level）在此统一管理。

# 内核加载基址
base_address = 0x40200000
# mtime 寄存器递增频率（单位：Hz），用于计算时间
# 根据TRM，mtime寄存器时钟来自 osc时钟/6 ，而 osc时钟为24MHz，
# 因此 mtime 寄存器频率为 4MHz
mtime_frequency = 4000000
# 内核支持的最大应用程序数量
max_app_num = 16
# 应用程序基址（须与 usr/build.rs 的 APP_BASE_ADDRESS 保持一致）
app_base_address = 0x40400000
# 应用程序最大大小（字节）
app_max_size = 0x200000
# 内核栈大小（字节）
kernel_stack_size = 0x2000
# 用户栈大小（字节）
user_stack_size = 0x2000
# 内核时钟中断周期（单位：微秒）
stimer_interval = 10000

# 日志等级过滤：低于该等级的日志在编译期被折叠剔除，不产生运行时开销，
# 其字符串字面量也不会进入 kernel.bin。
# 可选：error | warn | info | debug | trace（越靠前越严重；缺省 debug）
log_level = "debug"
