[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
sbi = { version = "0.3.0" }
riscv = { version = "0.16.1", features = ["s-mode"] }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
buddy_system_allocator = { version = "0.13.0" }
bitflags = { version = "2.13.2" }
xmas-elf = { version = "0.10.0" }

[build-dependencies]
toml = { version = "1.1.6" }
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = []
